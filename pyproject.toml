[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visynth"
version = "0.1.0"
description = "ViSynth — pipeline chuyển ngữ & tổng hợp tài liệu sang tiếng Việt (M0 prototype)"
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1",
  "charset-normalizer>=3.3",
  "cryptography>=42",  # kho khoá API mã hoá (visynth.pool.secrets, SPEC §17.14)
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "jsonschema>=4.20",
  "pyyaml>=6",
  "openapi-spec-validator>=0.7",
]

[project.scripts]
visynth = "visynth.cli:main"

[tool.setuptools]
package-dir = {"" = "apps/worker"}
packages = [
  "visynth",
  "visynth.checks",
  "visynth.eval",
  "visynth.extract",
  "visynth.llm",
  "visynth.pipeline",
  "visynth.pool",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["apps/worker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
