name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Mã sản phẩm (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check apps tests
          ruff format --check apps tests
      - name: Test
        run: pytest tests

  spec:
    name: Bộ đặc tả (validate + dựng lại SPEC.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r docs/requirements.txt
      - name: Kiểm tra nhất quán
        working-directory: docs
        run: python tools/validate_spec.py
      - name: SPEC.md phải khớp nguồn (không sửa tay)
        working-directory: docs
        run: python tools/check_spec_sync.py
      - name: OpenAPI hợp lệ
        working-directory: docs
        run: |
          python -c "import yaml, openapi_spec_validator as v; v.validate(yaml.safe_load(open('api/openapi.yaml')))"
      - name: Test tất định của bộ đặc tả
        working-directory: docs
        run: pytest tests --ignore=tests/pg_smoke.py
