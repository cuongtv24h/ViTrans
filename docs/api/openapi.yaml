      properties:
        name: {type: string, maxLength: 120}
        description: {type: string}
        domain: {type: string}
        source_lang: {type: string, default: en}
        target_lang: {type: string, default: vi}
    Glossary:
      type: object
      required: [id, scope, name, version, entry_count]
      properties:
        id: {type: string, format: uuid}
        scope:
          type: string
          enum: [personal, shared]
        name: {type: string}
        description:
          type: [string, 'null']
        domain:
          type: [string, 'null']
        version: {type: integer}
        entry_count: {type: integer}
        read_only: {type: boolean}
    Recipe:
      type: object
      required: [id, slug, name, is_official, version, config]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        description:
          type: [string, 'null']
        is_official: {type: boolean}
        visibility:
          type: string
          enum: [private, unlisted, public]
        version: {type: integer}
        config: {type: object, description: RecipeConfig - schemas/recipe_config.schema.json}
    Citation:
      type: object
      required: [unit_id, title_vi, statement_vi, evidence]
      properties:
        unit_id: {type: string, pattern: '^U-[0-9]{4,}$'}
        title_vi: {type: string}
        statement_vi: {type: string}
        evidence:
          type: array
          items:
            type: object
            required: [pid, quote]
            properties:
              pid: {type: string}
              quote: {type: string}
              page:
                type: [integer, 'null']
              timecode:
                type: [string, 'null']
                description: hh:mm:ss
              source_available: {type: boolean, description: false nếu tài liệu gốc đã hết hạn (vẫn có trích đoạn ngắn)}
    ReportBlock:
      type: object
      required: [block_id, type, markdown_vi, cites, status]
      properties:
        block_id: {type: string, pattern: '^S[0-9]{2,}\.b[0-9]{2,}$'}
        type:
          type: string
          enum: [paragraph, bullet_list, numbered_list, table, callout, subheading]
        markdown_vi: {type: string}
        cites:
          type: array
          items: {type: string}
        verdict:
          oneOf:
          - {$ref: '#/components/schemas/Verdict'}
          - {type: 'null'}
        status:
          type: string
          enum: [ok, repaired, flagged, removed]
    Report:
      type: object
      required: [id, job_id, title, level, sections, citations, created_at]
      properties:
        id: {type: string, format: uuid}
        job_id: {type: string, format: uuid}
        title: {type: string}
        level: {$ref: '#/components/schemas/Level'}
        quality_grade:
          type: [string, 'null']
          enum: [A, B, C, null]
        stats:
          type: object
          properties:
            coverage_core: {type: number}
            faithfulness_rate: {type: number}
            flagged_blocks: {type: integer}
            source_words: {type: integer}
            report_words: {type: integer}
        scope_note_md:
          type: [string, 'null']
        ai_notice: {type: string, description: Thông báo nội dung do AI tạo (Luật Trí tuệ nhân tạo 134/2025/QH15); luôn hiển thị}
        sections:
          type: array
          items:
            type: object
            required: [section_id, kind, title_vi, blocks]
            properties:
              section_id: {type: string}
              kind:
                type: string
                enum: [summary, body, facts_table, glossary_appendix, scope_note]
              title_vi: {type: string}
              blocks:
                type: array
                items: {$ref: '#/components/schemas/ReportBlock'}
        citations:
          type: object
          description: Từ điển unit_id -> Citation (chỉ gồm các unit được trích dẫn)
          additionalProperties: {$ref: '#/components/schemas/Citation'}
        created_at: {type: string, format: date-time}
    ReportPage:
      type: object
      required: [items]
      properties:
        next_cursor:
          type: [string, 'null']
        items:
          type: array
          items:
            type: object
            required: [id, title, level, created_at]
            properties:
              id: {type: string, format: uuid}
              title: {type: string}
              level: {$ref: '#/components/schemas/Level'}
              quality_grade:
                type: [string, 'null']
              created_at: {type: string, format: date-time}
    InviteCode:
      type: object
