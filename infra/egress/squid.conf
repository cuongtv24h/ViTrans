# Proxy ra ngoài CÓ DANH SÁCH TÊN MIỀN CHO PHÉP (§20.4 dòng "Egress").
#
# Vì sao cần: nếu một thư viện Python bị chèn mã độc, nó chỉ nói được với các tên miền trong danh
# sách này — không gửi khoá API tới nơi khác. Worker KHÔNG có tuyến nào khác ra internet: nó chỉ
# nằm trên mạng `internal` (không định tuyến ra ngoài) và biết proxy qua HTTPS_PROXY.
#
# Khi thêm nhà cung cấp LLM mới: thêm tên miền vào `allowed_domains` rồi `docker compose restart egress`.

acl allowed_domains dstdomain .generativelanguage.googleapis.com
acl allowed_domains dstdomain .googleapis.com
acl allowed_domains dstdomain .integrate.api.nvidia.com
acl allowed_domains dstdomain .nvidia.com
# Let's Encrypt (chỉ caddy cần, nhưng để đây cho tiện khi chạy chung mạng nội bộ)
acl allowed_domains dstdomain .acme-v02.api.letsencrypt.org
acl allowed_domains dstdomain .letsencrypt.org

acl SSL_ports port 443
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all

# Không lộ danh tính nội bộ ra ngoài; không lưu cache (mọi thứ đều là POST/JSON riêng tư).
via off
forwarded_for delete
cache deny all
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Cache-Control deny all

# Nhật ký: KHÔNG ghi thân yêu cầu (đã là mặc định) và bật che các chuỗi giống khoá API.
logformat visynth %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt
access_log stdio:/dev/stdout visynth
cache_log stdio:/dev/stderr
cache_store_log none
logfile_rotate 0
